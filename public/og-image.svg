<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative shapes -->
  <circle cx="900" cy="150" r="300" fill="#1e3a8a" opacity="0.25"/>
  <circle cx="200" cy="550" r="250" fill="#3b82f6" opacity="0.12"/>
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.35"/>

  <!-- Accent line -->
  <rect x="100" y="310" width="120" height="8" rx="4" fill="#3b82f6"/>

  <!-- Main title -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="88" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Kotitoimitus.com</text>

  <!-- Tagline -->
  <text x="100" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="38" font-weight="400" fill="#cbd5e1" letter-spacing="-0.5">B2B-ratkaisut alkoholin kotiintoimitukseen Suomessa</text>

  <!-- Subtle detail -->
  <text x="100" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Toimituslupa · Toimituspassi · Ikärajavalvonta · Etämyynti</text>

  <!-- Corner badge -->
  <rect x="980" y="520" width="140" height="40" rx="20" fill="#3b82f6"/>
  <text x="1050" y="547" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="16" font-weight="600" fill="#ffffff">2026–2027</text>
</svg>
