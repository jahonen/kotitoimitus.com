<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3d36"/>
      <stop offset="60%" stop-color="#164d44"/>
      <stop offset="100%" stop-color="#1f5d53"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a86c"/>
      <stop offset="100%" stop-color="#d9be8a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d5b3"/>
      <stop offset="100%" stop-color="#c9a86c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative shapes -->
  <circle cx="900" cy="150" r="300" fill="#164d44" opacity="0.25"/>
  <circle cx="200" cy="550" r="250" fill="#c9a86c" opacity="0.08"/>
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.35"/>

  <!-- Stylized logo: box and glass -->
  <g transform="translate(820, 180)" opacity="0.9">
    <!-- Box -->
    <path d="M20 80 L100 80 L120 110 L120 170 L20 170 L0 140 L0 80 Z" fill="#1a5d53" stroke="#c9a86c" stroke-width="2"/>
    <path d="M0 80 L60 50 L140 50 L120 80 Z" fill="#247a6c"/>
    <path d="M60 50 L60 110 L0 140 L0 80 Z" fill="#164d44" opacity="0.4"/>
    <!-- Glass -->
    <path d="M60 15 L60 60 C60 78 52 90 60 100 C68 90 60 78 60 60 L60 15 Z" fill="url(#glass)"/>
    <ellipse cx="60" cy="15" rx="12" ry="4" fill="#e8d5b3"/>
    <!-- Motion lines -->
    <path d="M-30 40 L-10 40" stroke="#c9a86c" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M-40 60 L-15 60" stroke="#c9a86c" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Accent line -->
  <rect x="100" y="310" width="120" height="8" rx="4" fill="#c9a86c"/>

  <!-- Main title -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="88" font-weight="700" fill="#f8faf8" letter-spacing="-1.5">Kotitoimitus.com</text>

  <!-- Tagline -->
  <text x="100" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="38" font-weight="400" fill="#c8d8d4" letter-spacing="-0.5">B2B-ratkaisut alkoholin kotiintoimitukseen</text>

  <!-- Subtle detail -->
  <text x="100" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="24" font-weight="400" fill="#8da89f">Toimituslupa · Toimituspassi · Ikärajavalvonta · Etämyynti</text>

  <!-- Corner badge -->
  <rect x="980" y="520" width="140" height="40" rx="20" fill="#c9a86c"/>
  <text x="1050" y="547" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif" font-size="16" font-weight="600" fill="#0f3d36">2026–2027</text>
</svg>
